services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Mount the Google Calendar credentials file if you use that integration.
    # The path inside the container must match GOOGLE_CALENDAR_CREDENTIALS_FILE in your .env.
    volumes:
      - ./google_calendar_credentials.json:/app/google_calendar_credentials.json:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Internal service name — the Next.js server proxies /api/* here at runtime.
        # For Verso/production, override with the backend's public URL before building.
        NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
